<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雅思口语题库</title>
<link rel="stylesheet" href="assets/style.css?v=202609023">
<script>
var _hmt = _hmt || [];
(function() {
  var hm = document.createElement("script");
  hm.src = "https://hm.baidu.com/hm.js?db0a7ad78994e8f35a69f28b2bc7a72a";
  var s = document.getElementsByTagName("script")[0];
  s.parentNode.insertBefore(hm, s);
})();
</script>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand" id="brand">
      <h1>雅思口语题库</h1>
      <span class="season" id="seasonTag"></span>
    </div>
    <div class="header-tools">
      <div class="search-box">
        <svg viewBox="0 0 24 24" class="icon"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="搜索话题、问题或范文…" autocomplete="off">
        <button class="clear-btn" id="clearSearch" title="清空">×</button>
      </div>
      <label class="practice-switch" id="practiceSwitch" title="隐藏范文，先自己答">
        <input type="checkbox" id="practiceToggle">
        <span>练习模式</span>
      </label>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- 目录页 -->
  <section id="pageList">
    <div class="filter-bar">
      <div class="filter-row">
        <span class="flabel">时段</span>
        <div class="seg" id="periodSeg"></div>
      </div>
      <div class="filter-row">
        <span class="flabel">部分</span>
        <div class="pills" id="partPills"></div>
      </div>
      <div class="filter-row" id="catRow">
        <span class="flabel">类别</span>
        <div class="pills pills-soft" id="catPills"></div>
      </div>
      <div class="filter-row">
        <span class="flabel">题型</span>
        <div class="pills pills-soft" id="statusPills"></div>
      </div>
    </div>
    <p class="stat" id="stat"></p>
    <div class="grid" id="topicGrid"></div>
    <div class="empty" id="listEmpty" hidden>没有匹配的话题，换个关键词试试。</div>
  </section>

  <!-- 详情页 -->
  <section id="pageDetail" hidden>
    <button class="back-btn" id="backBtn">← 返回目录</button>
    <article id="detailBody"></article>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap"><span id="updatedTag"></span><span id="footNote"></span></div>
</footer>

<div class="float-qr" id="floatQr">
  <div class="qr-img-wrap"><img class="qr-img" src="assets/qr-code.png?v=202609023" alt="二维码"></div>
  <div class="qr-caption">扫码下载 APP</div>
</div>

<script src="assets/data.js?v=202609023"></script>
<script src="assets/app.js?v=202609023"></script>
</body>
</html>
